<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>콘텐츠 업계 뉴스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 레이아웃: 흰 바탕 · 검정 글씨 · 노랑은 강조에만 (PRD.md 6. 디자인) */
:root {
  --canvas: #FFFFFF;
  --ink: #111111;
  --fg: #333333;
  --muted: #888888;
  --surface: #EEEEEE;
  --hover: #F3F3F3;
  --pressed: #DFDFDF;
  --border: #DBDBDB;
  --yellow: #FAE100;
  --on-yellow: #111111;
  --chip-on-bg: #111111;
  --chip-on-fg: #FFFFFF;
  --photo: #EEEEEE;
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Hiragino Sans", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #111111; --ink: #FFFFFF; --fg: #E6E6E6; --muted: #9A9A9A; --surface: #222222;
    --hover: #1C1C1C; --pressed: #2E2E2E; --border: #333333; --chip-on-bg: #FFFFFF; --chip-on-fg: #111111; --photo: #222222;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: auto; }
body { margin: 0; background: var(--canvas); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 21px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 머리 */
header .wrap { padding-block: 20px 8px; display: flex; flex-direction: column; gap: 16px; }
.brand { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 28px; line-height: 42px; font-weight: 700; color: var(--ink); letter-spacing: -0.5px; }
.brand::before { content: ""; width: 14px; height: 14px; border-radius: 999px; background: var(--yellow); flex: none; }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: transparent; height: 37px; padding: 4px 16px 6px; border-radius: 999px; font-size: 17px; line-height: 27px; display: inline-flex; align-items: center; gap: 6px; color: var(--fg); }
.tab:hover, .tab[aria-selected="true"] { background: var(--hover); }
.tab:active { background: var(--pressed); }
.tab[aria-selected="true"] { font-weight: 700; color: var(--ink); }
.count { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--yellow); color: var(--on-yellow); font-size: 12px; line-height: 22px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }

main .wrap { padding-block: 8px 96px; }
.note { margin: 0 0 20px; color: var(--muted); font-size: 12px; line-height: 18px; letter-spacing: -0.2px; }

/* 고르기 줄 */
.controls { display: grid; gap: 8px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.label { flex: 0 0 40px; font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip { height: 40px; padding: 0 20px; border-radius: 30px; border: 0; background: var(--surface); color: var(--fg); font-size: 15px; font-weight: 700; }
.chip:active { background: var(--pressed); }
.chip[aria-pressed="true"] { background: var(--chip-on-bg); color: var(--chip-on-fg); }
.chip.kw { height: 36px; padding: 0 16px; background: transparent; border: 2px solid var(--border); font-size: 14px; }
.chip.kw[aria-pressed="true"] { background: var(--yellow); border-color: #111111; color: var(--on-yellow); }
.chip .en { font-weight: 400; font-size: 12px; margin-left: 4px; }
.tools { display: flex; gap: 20px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface); }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 16px; border-radius: 999px; font-size: 14px; color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--canvas); color: var(--ink); font-weight: 700; }

/* 분야 묶음 */
.sections { display: flex; flex-direction: column; gap: 40px; }
.section { scroll-margin-top: 16px; display: flex; flex-direction: column; gap: 16px; }
.shead { display: flex; align-items: baseline; gap: 8px; margin: 0; font-size: 20px; line-height: 28px; font-weight: 700; color: var(--ink); }
.shead .n { font-size: 14px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.more { align-self: center; height: 40px; padding: 0 20px; border-radius: 24px; border: 0; background: var(--surface); font-size: 14px; color: var(--ink); }
.more:active { background: var(--pressed); }

/* 카드 모양 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.card { position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 16px; overflow: hidden; background: var(--photo); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.new { align-self: flex-start; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--yellow); color: var(--on-yellow); border: 2px solid #111111; font-size: 11px; line-height: 16px; font-weight: 800; letter-spacing: 0.3px; }
.title { margin: 0; font-size: 16px; line-height: 24px; font-weight: 700; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; overflow-wrap: anywhere; }
.link { text-decoration: none; }
.link::after { content: ""; position: absolute; inset: 0; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.meta { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; color: var(--muted); font-size: 12px; line-height: 18px; letter-spacing: -0.2px; font-variant-numeric: tabular-nums; }
.outlet { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 2px; border: 0; background: transparent; padding: 2px 6px 2px 0; border-radius: 999px; color: var(--muted); font-size: 12px; }
.outlet svg { width: 14px; height: 14px; }
.outlet[aria-pressed="true"] { color: var(--fg); font-weight: 700; }
.outlet[aria-pressed="true"] svg { color: #111111; fill: var(--yellow); }
.actions { display: flex; align-items: center; gap: 4px; }
.act { position: relative; z-index: 1; display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 18px; border: 0; background: transparent; color: var(--fg); font-size: 12px; text-decoration: none; }
.act:hover { background: var(--surface); }
.act:active { background: var(--pressed); }
.star { position: relative; z-index: 1; margin-left: auto; width: 36px; height: 36px; border-radius: 18px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--fg); }
.star:hover { background: var(--surface); }
.star svg { width: 22px; height: 22px; }
.star[aria-pressed="true"] svg { color: #111111; fill: var(--yellow); }
.card.is-read .title { color: var(--muted); font-weight: 500; }
.card.is-read .thumb img { opacity: 0.45; }

/* 목록 모양 */
.list .grid { grid-template-columns: 1fr; gap: 0; }
.list .card { flex-direction: row; align-items: flex-start; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); }
.list .card:first-child { padding-top: 0; }
.list .thumb { flex: 0 0 128px; border-radius: 12px; }
.list .body { flex: 1; }
.list .title { font-size: 15px; line-height: 22px; }
.list .bottom { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.list .actions { flex: 1; }
@media (max-width: 520px) {
  .list .thumb { flex-basis: 96px; }
  .label { flex-basis: 100%; }
}

.empty { padding: 40px 16px; text-align: center; border-radius: 16px; background: var(--surface); color: var(--muted); }
.empty strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 16px; }

/* 시청자 반응 */
.yt-form { display: flex; gap: 8px; margin-bottom: 8px; }
.field { flex: 1; min-width: 0; height: 44px; padding: 0 20px; border-radius: 30px; border: 2px solid var(--border); background: var(--canvas); color: var(--ink); font: inherit; font-size: 15px; }
.field:focus { outline: none; border-color: var(--ink); }
.go { flex: none; height: 44px; padding: 0 20px; border-radius: 30px; border: 0; background: var(--chip-on-bg); color: var(--chip-on-fg); font-size: 15px; font-weight: 700; }
.keys { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.yt-key { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px; line-height: 18px; }
.yt-key .field { flex: 1 1 220px; height: 36px; font-size: 13px; }
.yt-key .act { background: var(--surface); }
.yt-key .bad { flex-basis: 100%; color: var(--ink); font-weight: 700; }
.msg { padding: 20px; border-radius: 16px; background: var(--surface); color: var(--ink); font-size: 14px; line-height: 24px; }
.msg.loading { color: var(--muted); }
.video { margin: 0 0 4px; font-size: 20px; line-height: 28px; font-weight: 700; color: var(--ink); word-break: keep-all; overflow-wrap: anywhere; }
.video a { text-decoration: none; }
.video a:hover { text-decoration: underline; text-underline-offset: 3px; }
.cmts { list-style: none; margin: 16px 0 0; padding: 0; }
.cmt { padding: 16px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.cmt-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cmt-head strong { color: var(--ink); font-size: 14px; }
.cmt-head span, .cmt-like { color: var(--muted); font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums; }
.cmt-text { margin: 0; color: var(--fg); font-size: 14px; line-height: 24.92px; letter-spacing: -0.2px; white-space: pre-line; overflow-wrap: anywhere; }
.cmt-like strong { color: var(--ink); }
.cmt-num { color: var(--muted); font-size: 12px; font-weight: 700; }
.cmt.flash { background: var(--hover); }

/* 반응 분석 리포트 */
.report-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 16px 0; }
.go:disabled { background: var(--pressed); color: var(--muted); cursor: wait; }
.go.ghost { background: var(--surface); color: var(--ink); }
.report { margin: 0 0 24px; padding: 20px; border-radius: 16px; border: 2px solid var(--ink); display: flex; flex-direction: column; gap: 20px; }
.r-head h2 { margin: 0; font-size: 20px; line-height: 28px; color: var(--ink); }
.r-head .note { margin: 4px 0 0; }
.r-block h3 { margin: 0 0 8px; font-size: 16px; line-height: 24px; color: var(--ink); }
.r-summary { margin: 0; font-size: 15px; line-height: 26px; color: var(--fg); }
.r-bar { display: flex; height: 16px; border-radius: 999px; overflow: hidden; background: var(--surface); }
.r-pos { background: var(--yellow); }
.r-neu { background: var(--border); }
.r-neg { background: var(--ink); }
.r-legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0 12px; font-size: 13px; }
.r-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 999px; margin-right: 6px; }
.r-legend strong { color: var(--ink); }
.r-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.r-list li { padding: 12px 16px; border-radius: 12px; background: var(--surface); }
.r-list strong { color: var(--ink); font-size: 14px; }
.r-list p { margin: 4px 0 0; font-size: 14px; line-height: 22px; }
.ev { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; line-height: 18px; color: var(--muted); }
.evn { border: 0; background: var(--canvas); color: var(--ink); border-radius: 999px; height: 22px; padding: 0 8px; font-size: 12px; font-weight: 700; }
.ev q { flex-basis: 100%; }
.r-kw { display: flex; flex-wrap: wrap; gap: 6px; }
.r-kw span { height: 32px; padding: 0 14px; border-radius: 30px; background: var(--surface); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink); }
.r-kw b { font-size: 12px; color: var(--muted); }
.r-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
.r-none { margin: 0; color: var(--muted); }
.r-foot { margin: 0; font-size: 12px; line-height: 18px; color: var(--muted); }
.r-export { display: flex; gap: 8px; flex-wrap: wrap; }
/* PDF로 내보낼 때는 화면 설정과 상관없이 흰 종이에 검정 글씨 */
.paper { --canvas: #FFFFFF; --ink: #111111; --fg: #333333; --muted: #888888; --surface: #EEEEEE; --border: #DBDBDB; --hover: #F3F3F3;
  width: 690px; padding: 8px; /* A4에서 여백(12mm)을 뺀 폭에 맞춤 */ background: #FFFFFF; color: #333333; font-family: var(--font); display: flex; flex-direction: column; gap: 20px; }
.paper .report { border: 0; padding: 0; margin: 0; }

/* 바로 가기 */
.jump { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 5; }
.jump .tag { height: 32px; padding: 0 12px; border-radius: 16px; border: 2px solid #FFFFFF; background: #111111; color: #FFFFFF; font-size: 13px; font-weight: 700; }
.jump .tag:hover { background: rgba(17, 17, 17, 0.75); }
.jump .top { width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--border); background: var(--canvas); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; }
.jump .top svg { width: 22px; height: 22px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1 class="brand">콘텐츠 업계 뉴스</h1>
    <nav class="tabs" role="tablist" aria-label="화면 선택">
      <button class="tab" id="tab-news" role="tab" aria-selected="true" aria-controls="panel-news">업계 뉴스</button>
      <button class="tab" id="tab-scrap" role="tab" aria-selected="false" aria-controls="panel-scrap">내 스크랩 <span class="count" id="scrap-count">0</span></button>
      <button class="tab" id="tab-yt" role="tab" aria-selected="false" aria-controls="panel-yt">시청자 반응</button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <section id="panel-news" role="tabpanel" aria-labelledby="tab-news">
      <p class="note" id="source-note">기사를 불러오는 중입니다.</p>
      <div class="controls">
        <div class="row"><span class="label">나라</span><div class="chips" id="country-chips"></div></div>
        <div class="row"><span class="label">키워드</span><div class="chips" id="keyword-chips"></div></div>
        <div class="row">
          <span class="label">보기</span>
          <div class="tools">
            <div class="seg" role="group" aria-label="정렬">
              <button data-sort="latest">최신순</button>
              <button data-sort="fav">즐겨찾는 언론사 먼저</button>
            </div>
            <div class="seg" role="group" aria-label="보기 모양">
              <button data-view="card">카드</button>
              <button data-view="list">목록</button>
            </div>
          </div>
        </div>
      </div>
      <div class="sections" id="sections"></div>
    </section>

    <section id="panel-scrap" role="tabpanel" aria-labelledby="tab-scrap" hidden>
      <p class="note">스크랩은 이 기기에 저장됩니다. 창을 닫아도 남지만, 다른 기기에서는 보이지 않습니다.</p>
      <div class="section">
        <h2 class="shead">스크랩한 기사 <span class="n" id="scrap-n">0건</span></h2>
        <div id="scrap-body"></div>
      </div>
    </section>

    <section id="panel-yt" role="tabpanel" aria-labelledby="tab-yt" hidden>
      <p class="note">유튜브 영상 주소를 넣으면 그 영상의 인기 댓글을 보여 줍니다.</p>
      <form class="yt-form" id="yt-form" novalidate>
        <input class="field" id="yt-url" type="text" inputmode="url" autocomplete="off" placeholder="https://www.youtube.com/watch?v=…" aria-label="유튜브 영상 주소">
        <button class="go" type="submit">댓글 보기</button>
      </form>
      <div class="keys">
        <div class="yt-key" id="key-yt"></div>
        <div class="yt-key" id="key-gemini"></div>
        <p class="note" style="margin:0">키는 이 기기의 브라우저에만 저장돼요. 다른 사람에게는 보이지 않아요.</p>
      </div>
      <div id="yt-result"></div>
    </section>
  </div>
</main>

<div class="jump" id="jump" hidden>
  <button class="tag" data-jump="drama">드라마</button>
  <button class="tag" data-jump="music">음악</button>
  <button class="top" data-jump="top" aria-label="맨 위로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div>

<script>
const COUNTRIES = [
  { id: "all", label: "전체" }, { id: "kr", label: "국내" }, { id: "us", label: "미국" },
  { id: "jp", label: "일본" }, { id: "cn", label: "중국" }, { id: "sea", label: "동남아" }
];
const KEYWORDS = [
  { id: "kdrama", label: "K-드라마", words: ["K-드라마", "K-drama"] },
  { id: "netflix", label: "넷플릭스", words: ["넷플릭스", "Netflix"] },
  { id: "kpop", label: "K-POP", words: ["케이팝", "K-pop"] },
  { id: "hallyu", label: "한류", words: ["한류", "Hallyu"] }
];
const CATEGORIES = [{ id: "drama", label: "드라마·영화·OTT" }, { id: "music", label: "음악·K-POP" }];
const FIRST_SHOW = 4; // 분야마다 처음 보여 줄 기사 수

// 이 기기에 남기는 기록 (스크랩, 즐겨찾는 언론사, 읽은 기사, 본 기사, 보기 설정)
const store = {
  get(key, fallback) { try { const v = localStorage.getItem("cn." + key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem("cn." + key, JSON.stringify(value)); } catch { /* 저장이 막힌 브라우저 */ } }
};

let ARTICLES = [];
let COLLECTED_AT = "";
const state = {
  country: "all", keyword: null, tab: "news", expanded: {},
  view: store.get("view", "card"),
  sort: store.get("sort", "latest"),
  scraps: store.get("scraps", []),
  favOutlets: new Set(store.get("favOutlets", [])),
  read: new Set(store.get("read", []))
};
const prevSeen = store.get("seen", null); // 지난번에 본 기사들. 처음 열면 null
const seenNow = new Set(prevSeen || []);

const STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (d) => d.replaceAll("-", ".");
const byNewest = (a, b) => b.date.localeCompare(a.date) || b.id - a.id;
const isForeign = (a) => !/[가-힣]/.test(a.title);
const translateUrl = (url) => "https://translate.google.com/translate?sl=auto&tl=ko&u=" + encodeURIComponent(url);
const keep = (set, max) => [...set].slice(-max);

function matchesKeyword(a) {
  if (!state.keyword) return true;
  const title = a.title.toLowerCase();
  return KEYWORDS.find((k) => k.id === state.keyword).words.some((w) => title.includes(w.toLowerCase()));
}

function ordered(items) {
  const list = [...items].sort(byNewest);
  if (state.sort !== "fav") return list;
  return list.sort((a, b) => state.favOutlets.has(b.outlet) - state.favOutlets.has(a.outlet));
}

function cardHTML(a) {
  const scrapped = state.scraps.some((s) => s.url === a.url);
  const fav = state.favOutlets.has(a.outlet);
  const isNew = prevSeen && !prevSeen.includes(a.url);
  const url = esc(a.url);
  const actions = `
    <div class="actions">
      <button class="act" data-copy="${url}">복사</button>
      ${isForeign(a) ? `<a class="act" data-read="${url}" href="${esc(translateUrl(a.url))}" target="_blank" rel="noopener noreferrer">번역해서 보기</a>` : ""}
      <button class="star" data-star="${url}" aria-pressed="${scrapped}" aria-label="${scrapped ? "스크랩 빼기" : "스크랩하기"}">${STAR}</button>
    </div>`;
  const meta = `
    <div class="meta">
      <button class="outlet" data-fav="${esc(a.outlet)}" aria-pressed="${fav}" aria-label="${esc(a.outlet)} ${fav ? "즐겨찾기 빼기" : "즐겨찾기에 넣기"}">${esc(a.outlet)}${STAR}</button>
      <span>· ${fmtDate(a.date)}</span>
    </div>`;
  return `
    <article class="card${state.read.has(a.url) ? " is-read" : ""}">
      <div class="thumb"><img src="${esc(a.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"></div>
      <div class="body">
        ${isNew ? '<span class="new">NEW</span>' : ""}
        <h3 class="title"><a class="link" data-read="${url}" href="${url}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h3>
        ${state.view === "list" ? `<div class="bottom">${meta}${actions}</div>` : meta + actions}
      </div>
    </article>`;
}

function renderControls() {
  $("country-chips").innerHTML = COUNTRIES.map((c) =>
    `<button class="chip" data-country="${c.id}" aria-pressed="${state.country === c.id}">${c.label}</button>`).join("");
  $("keyword-chips").innerHTML = KEYWORDS.map((k) =>
    `<button class="chip kw" data-keyword="${k.id}" aria-pressed="${state.keyword === k.id}">${k.label}<span class="en">${k.words[1]}</span></button>`).join("");
  document.querySelectorAll("[data-sort]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.sort === state.sort));
  document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.view === state.view));
  document.body.classList.toggle("list", state.view === "list");
}

function renderNews() {
  const list = ARTICLES.filter((a) => (state.country === "all" || a.country === state.country) && matchesKeyword(a));
  $("sections").innerHTML = CATEGORIES.map((cat) => {
    const items = ordered(list.filter((a) => a.cat === cat.id));
    const open = state.expanded[cat.id];
    const shown = open ? items : items.slice(0, FIRST_SHOW);
    const rest = items.length - FIRST_SHOW;
    const body = items.length
      ? `<div class="grid">${shown.map(cardHTML).join("")}</div>` +
        (rest > 0 ? `<button class="more" data-more="${cat.id}">${open ? "접기" : `${rest}건 더 보기`}</button>` : "")
      : `<div class="empty"><strong>조건에 맞는 기사가 없어요</strong>다른 나라나 키워드를 눌러 보세요.</div>`;
    return `<div class="section" id="sec-${cat.id}"><h2 class="shead">${cat.label} <span class="n">${items.length}건</span></h2>${body}</div>`;
  }).join("");
}

function renderScrap() {
  const items = state.scraps;
  $("scrap-count").textContent = items.length;
  $("scrap-n").textContent = `${items.length}건`;
  $("scrap-body").innerHTML = items.length
    ? `<div class="grid">${items.map(cardHTML).join("")}</div>`
    : `<div class="empty"><strong>아직 스크랩한 기사가 없어요</strong>업계 뉴스에서 ☆를 눌러 보세요.</div>`;
}

function renderNote() {
  $("source-note").textContent = COLLECTED_AT
    ? `Bing 뉴스에서 모은 최근 14일 기사 ${ARTICLES.length}건 · 마지막 수집 ${fmtDate(COLLECTED_AT)} · 약 30분마다 새로 모읍니다.`
    : "기사를 불러오지 못했어요. 잠시 뒤 다시 열어 보세요.";
}

function renderAll() { renderControls(); renderNote(); renderNews(); renderScrap(); }

function setTab(tab) {
  state.tab = tab;
  for (const t of ["news", "scrap", "yt"]) {
    $("tab-" + t).setAttribute("aria-selected", tab === t);
    $("panel-" + t).hidden = tab !== t;
  }
  updateJump();
}

function toggleScrap(url) {
  const i = state.scraps.findIndex((s) => s.url === url);
  if (i >= 0) state.scraps.splice(i, 1);
  else state.scraps.unshift(ARTICLES.find((a) => a.url === url));
  store.set("scraps", state.scraps);
  renderNews(); renderScrap();
}

function toggleFav(outlet) {
  if (state.favOutlets.has(outlet)) state.favOutlets.delete(outlet); else state.favOutlets.add(outlet);
  store.set("favOutlets", [...state.favOutlets]);
  renderNews(); renderScrap();
}

function markRead(url) {
  state.read.add(url);
  store.set("read", keep(state.read, 1000));
  setTimeout(() => { renderNews(); renderScrap(); }, 0);
}

async function copy(button, url) {
  const a = ARTICLES.find((x) => x.url === url) || state.scraps.find((x) => x.url === url);
  const text = `${a.title}\n${a.url}`;
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea");
    t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove();
  }
  button.textContent = "복사됨";
  setTimeout(() => { button.textContent = "복사"; }, 1500);
}

function updateJump() {
  $("jump").hidden = state.tab !== "news" || window.scrollY < 400;
}

document.addEventListener("click", (e) => {
  const t = (sel) => e.target.closest(sel);
  let el;
  if ((el = t("[data-country]"))) { state.country = el.dataset.country; state.expanded = {}; renderControls(); renderNews(); return; }
  if ((el = t("[data-keyword]"))) { state.keyword = state.keyword === el.dataset.keyword ? null : el.dataset.keyword; state.expanded = {}; renderControls(); renderNews(); return; }
  if ((el = t("[data-sort]"))) { state.sort = el.dataset.sort; store.set("sort", state.sort); renderControls(); renderNews(); return; }
  if ((el = t("[data-view]"))) { state.view = el.dataset.view; store.set("view", state.view); renderControls(); renderNews(); renderScrap(); return; }
  if ((el = t("[data-more]"))) { state.expanded[el.dataset.more] = !state.expanded[el.dataset.more]; renderNews(); if (!state.expanded[el.dataset.more]) $("sec-" + el.dataset.more).scrollIntoView(); return; }
  if ((el = t("[data-star]"))) { toggleScrap(el.dataset.star); return; }
  if ((el = t("[data-fav]"))) { toggleFav(el.dataset.fav); return; }
  if ((el = t("[data-copy]"))) { copy(el, el.dataset.copy); return; }
  if ((el = t("[data-read]"))) { markRead(el.dataset.read); return; }
  if ((el = t("[data-jump]"))) { if (el.dataset.jump === "top") window.scrollTo(0, 0); else $("sec-" + el.dataset.jump).scrollIntoView(); return; }
  if ((el = t("[data-key]"))) { keyAction(el.dataset.key); return; }
  if ((el = t("[data-report]"))) { makeReport(); return; }
  if ((el = t("[data-export]"))) { exportReport(el.dataset.export, el); return; }
  if ((el = t("[data-ev]"))) { showEvidence(el.dataset.ev); return; }
  if ((el = t("[role=tab]"))) setTab(el.id.slice(4));
});
document.addEventListener("auxclick", (e) => { const el = e.target.closest("[data-read]"); if (el) markRead(el.dataset.read); });
window.addEventListener("scroll", updateJump, { passive: true });

// ── 시청자 반응: 유튜브 영상의 인기 댓글 + 반응 분석 리포트 ──
// API 키는 공개 저장소에 넣지 않고, 이 기기의 브라우저에만 저장함
const KEYS = {
  yt: { label: "YouTube API 키", storeKey: "ytKey" },
  gemini: { label: "Gemini API 키", storeKey: "geminiKey" }
};
const keys = { yt: store.get("ytKey", ""), gemini: store.get("geminiKey", "") };
let geminiFromFile = false; // 내 컴퓨터의 secrets.js에서 채운 키인지
let ytRequest = 0;
let current = null; // 지금 보이는 영상과 댓글 { id, title, channel, comments: [{ n, author, date, text, likes }] }
let report = null;

function renderKey(kind, error) {
  const k = KEYS[kind];
  if (kind === "gemini" && geminiFromFile && !error) {
    $("key-gemini").innerHTML = `<span>${k.label}: 내 컴퓨터의 secrets.js에서 자동으로 채웠어요.</span>`;
    return;
  }
  $("key-" + kind).innerHTML = keys[kind] && !error
    ? `<span>${k.label}가 이 기기에 저장되어 있어요.</span><button class="act" data-key="change:${kind}">키 바꾸기</button>`
    : `<input class="field" id="key-input-${kind}" type="password" autocomplete="off" placeholder="${k.label} 붙여넣기" aria-label="${k.label}">
       <button class="act" data-key="save:${kind}">저장</button>
       ${error ? `<span class="bad">${esc(error)}</span>` : ""}`;
}

function keyAction(spec) {
  const [action, kind] = spec.split(":");
  if (action === "change") { renderKey(kind, ""); $("key-input-" + kind).focus(); return; }
  const value = $("key-input-" + kind).value.trim();
  if (!value) { renderKey(kind, "API 키를 넣어 주세요."); return; }
  keys[kind] = value;
  store.set(KEYS[kind].storeKey, value);
  renderKey(kind);
}

// 내 컴퓨터(localhost)에서 열면 secrets.js의 Gemini 키를 자동으로 채움. 공개 사이트에는 secrets.js가 없음
function loadLocalSecrets() {
  if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  const s = document.createElement("script");
  s.src = "secrets.js";
  s.onload = () => {
    if (typeof GEMINI_API_KEY !== "string" || !GEMINI_API_KEY) return;
    keys.gemini = GEMINI_API_KEY;
    geminiFromFile = true;
    renderKey("gemini");
  };
  document.head.append(s);
}

// 유튜브 주소(또는 11자리 영상 번호)에서 영상 번호 꺼내기
function videoIdFrom(text) {
  const s = text.trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  let u;
  try { u = new URL(/^https?:\/\//i.test(s) ? s : "https://" + s); } catch { return null; }
  const host = u.hostname.replace(/^(www|m|music)\./, "");
  let id = null;
  if (host === "youtu.be") id = u.pathname.split("/")[1];
  else if (host === "youtube.com") id = u.searchParams.get("v") || (u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/) || [])[1];
  return id && /^[\w-]{11}$/.test(id) ? id : null;
}

function ytMessage(status, reason, message) {
  if (reason === "commentsDisabled") return "이 영상은 댓글 기능이 꺼져 있어요.";
  if (reason === "videoNotFound") return "영상을 찾을 수 없어요. 삭제됐거나 비공개 영상일 수 있어요.";
  if (reason === "quotaExceeded" || reason === "dailyLimitExceeded") return "오늘 쓸 수 있는 조회 횟수를 다 썼어요. 한국 시간 오후 4~5시 이후에 다시 해 보세요.";
  if (reason === "keyInvalid" || /API key not valid/i.test(message)) return "API 키가 올바르지 않아요. '키 바꾸기'를 눌러 다시 넣어 주세요.";
  if (reason === "accessNotConfigured" || /has not been used|is disabled/i.test(message)) return "이 API 키로는 YouTube Data API를 쓸 수 없어요. Google Cloud에서 'YouTube Data API v3'를 켜 주세요.";
  if (/referer|referrer/i.test(message)) return "이 API 키는 이 주소에서 쓸 수 없게 막혀 있어요. Google Cloud의 키 설정을 확인해 주세요.";
  return `댓글을 가져오지 못했어요. 잠시 뒤 다시 해 보세요. (오류 ${status})`;
}

async function yt(path, params) {
  let res;
  try { res = await fetch("https://www.googleapis.com/youtube/v3/" + path + "?" + new URLSearchParams({ ...params, key: keys.yt }), { signal: AbortSignal.timeout(15000) }); }
  catch (e) { throw new Error(e.name === "TimeoutError" ? "유튜브 응답이 너무 늦어요. 잠시 뒤 다시 해 보세요." : "인터넷 연결을 확인해 주세요. 유튜브에 접속하지 못했어요."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(ytMessage(res.status, data.error?.errors?.[0]?.reason || "", data.error?.message || ""));
  return data;
}

const ytShow = (html) => { $("yt-result").innerHTML = html; };
const ytNotice = (text, loading) => ytShow(`<div class="msg${loading ? " loading" : ""}">${esc(text)}</div>`);
const kstDay = (iso) => fmtDate(new Date(Date.parse(iso) + 9 * 3600e3).toISOString().slice(0, 10));
const clip = (s, n) => (s.length > n ? s.slice(0, n) + "…" : s).replace(/\s+/g, " ");

function commentHTML(c) {
  return `<li class="cmt" id="cmt-${c.n}">
    <div class="cmt-head"><span class="cmt-num">#${c.n}</span><strong>${esc(c.author)}</strong><span>${c.date}</span></div>
    <p class="cmt-text">${esc(c.text)}</p>
    <div class="cmt-like">좋아요 <strong>${c.likes.toLocaleString("ko-KR")}</strong></div>
  </li>`;
}

async function showComments(e) {
  e.preventDefault();
  const input = $("yt-url").value;
  if (!input.trim()) return ytNotice("유튜브 영상 주소를 넣어 주세요.");
  const id = videoIdFrom(input);
  if (!id) return ytNotice("유튜브 영상 주소가 아니에요. 예: https://www.youtube.com/watch?v=영상번호 또는 https://youtu.be/영상번호");
  if (!keys.yt) { renderKey("yt", "먼저 YouTube API 키를 넣고 '저장'을 눌러 주세요."); return ytShow(""); }

  const mine = ++ytRequest;
  current = null;
  report = null;
  ytNotice("댓글을 불러오는 중이에요…", true);
  try {
    const video = (await yt("videos", { part: "snippet", id })).items?.[0];
    if (!video) throw new Error(ytMessage(404, "videoNotFound", ""));
    const threads = await yt("commentThreads", { part: "snippet", videoId: id, order: "relevance", maxResults: 50, textFormat: "plainText" });
    if (mine !== ytRequest) return;
    const title = `<h2 class="video"><a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener noreferrer">${esc(video.snippet.title)}</a></h2>`;
    if (!threads.items?.length) return ytShow(title + `<div class="msg">아직 댓글이 없는 영상이에요.</div>`);
    // 유튜브 인기 댓글 50개를 좋아요 많은 순으로 다시 정렬하고 번호를 붙임
    const comments = threads.items
      .map((it) => it.snippet.topLevelComment.snippet)
      .sort((a, b) => b.likeCount - a.likeCount)
      .map((c, i) => ({ n: i + 1, author: c.authorDisplayName, date: kstDay(c.publishedAt), text: c.textOriginal ?? c.textDisplay, likes: Number(c.likeCount) }));
    current = { id, title: video.snippet.title, channel: video.snippet.channelTitle, comments };
    ytShow(title + `<p class="note" style="margin:0">${esc(current.channel)} · 인기 댓글 ${comments.length}개 · 좋아요 많은 순</p>
      <div class="report-bar"><button class="go" id="report-btn" data-report>반응 분석 리포트</button><span class="note" style="margin:0">위 댓글 ${comments.length}개를 Gemini로 분석해요.</span></div>
      <div id="report"></div>
      <ol class="cmts">${comments.map(commentHTML).join("")}</ol>`);
  } catch (err) {
    if (mine === ytRequest) ytNotice(err.message);
  }
}

// ── 반응 분석 리포트 (Gemini) ──
const MODEL = "gemini-3.1-flash-lite";
const RULES = `너는 유튜브 댓글을 읽고 콘텐츠 업계 실무자에게 보고하는 분석가다. 반드시 지킬 규칙:
1. 아래 [댓글 목록]에 실제로 적힌 내용만 근거로 쓴다. 댓글에 없는 사실, 수치, 인물, 사건, 추측은 절대 쓰지 않는다.
2. 모든 항목의 evidence에는 그 내용의 근거가 되는 댓글 번호를 넣는다. 근거 댓글을 찾을 수 없는 항목은 아예 쓰지 않는다. 해당 내용이 없으면 빈 배열로 둔다.
3. comments에는 모든 댓글 번호마다 감정(긍정/중립/부정)과, 그 댓글이 쓰인 언어를 한국어 이름(예: 한국어, 영어, 스페인어)으로 적는다. 이모지만 있거나 언어를 알 수 없으면 "알 수 없음"으로 적는다.
4. languages의 language는 comments에 적은 언어 이름과 똑같이 쓴다.
5. keywords에는 여러 댓글에 반복해서 나오는 단어를 댓글 원문에 쓰인 표기 그대로 적는다. 번역하지 않는다. 최대 10개.
6. 요약, 판단 근거, 칭찬받은 점, 지적받은 점, 액션 제안은 한국어로 짧고 분명하게 쓴다. 액션 제안은 댓글에서 드러난 반응에 직접 근거해야 한다.`;

const withEvidence = (fields) => ({
  type: "OBJECT",
  properties: { ...fields, evidence: { type: "ARRAY", items: { type: "INTEGER" } } },
  required: [...Object.keys(fields), "evidence"]
});
const SENTIMENT = { type: "STRING", format: "enum", enum: ["긍정", "중립", "부정"] };
const SCHEMA = {
  type: "OBJECT",
  properties: {
    summary: { type: "STRING" },
    comments: { type: "ARRAY", items: { type: "OBJECT", properties: { n: { type: "INTEGER" }, sentiment: SENTIMENT, language: { type: "STRING" } }, required: ["n", "sentiment", "language"] } },
    sentimentBasis: { type: "ARRAY", items: withEvidence({ label: SENTIMENT, reason: { type: "STRING" } }) },
    keywords: { type: "ARRAY", items: { type: "STRING" } },
    languages: { type: "ARRAY", items: withEvidence({ language: { type: "STRING" }, reaction: { type: "STRING" } }) },
    praises: { type: "ARRAY", items: withEvidence({ point: { type: "STRING" } }) },
    criticisms: { type: "ARRAY", items: withEvidence({ point: { type: "STRING" } }) },
    actions: { type: "ARRAY", items: withEvidence({ action: { type: "STRING" }, reason: { type: "STRING" } }) }
  },
  required: ["summary", "comments", "sentimentBasis", "keywords", "languages", "praises", "criticisms", "actions"]
};

function geminiMessage(status, data) {
  const msg = data.error?.message || "";
  if (/API key not valid|API_KEY_INVALID/i.test(msg)) return "Gemini API 키가 올바르지 않아요. '키 바꾸기'를 눌러 다시 넣어 주세요.";
  if (status === 429) return "Gemini 사용량 한도에 걸렸어요. 1~2분 뒤에 다시 해 보세요.";
  if (status === 403) return "이 Gemini 키로는 분석할 수 없어요. Google AI Studio에서 키 권한을 확인해 주세요.";
  if (status === 404) return `Gemini 모델(${MODEL})을 찾을 수 없어요.`;
  if (status >= 500) return "Gemini가 지금 바빠요. 잠시 뒤 다시 해 보세요.";
  return `리포트를 만들지 못했어요. 잠시 뒤 다시 해 보세요. (오류 ${status})`;
}

async function askGemini(c, retry = true) {
  const list = c.comments.map((x) => `#${x.n} (좋아요 ${x.likes}) ${x.text.replace(/\s+/g, " ")}`).join("\n");
  let res;
  try {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": keys.gemini },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: RULES }] },
        contents: [{ role: "user", parts: [{ text: `[영상] ${c.title} / ${c.channel}\n[댓글 목록]\n${list}` }] }],
        generationConfig: { temperature: 0.2, responseMimeType: "application/json", responseSchema: SCHEMA }
      }),
      signal: AbortSignal.timeout(90000)
    });
  } catch (e) {
    throw new Error(e.name === "TimeoutError" ? "Gemini 응답이 너무 늦어요. 잠시 뒤 다시 해 보세요." : "인터넷 연결을 확인해 주세요. Gemini에 접속하지 못했어요.");
  }
  const data = await res.json().catch(() => ({}));
  // Gemini가 잠깐 바쁠 때(500·503)는 3초 뒤 한 번 더 시도
  if (res.status >= 500 && retry) { await new Promise((r) => setTimeout(r, 3000)); return askGemini(c, false); }
  if (!res.ok) throw new Error(geminiMessage(res.status, data));
  if (data.promptFeedback?.blockReason) throw new Error("Gemini가 안전 정책 때문에 이 댓글들의 분석을 거절했어요.");
  const text = (data.candidates?.[0]?.content?.parts || []).map((p) => p.text || "").join("");
  try { return JSON.parse(text); } catch { throw new Error("Gemini의 답을 읽지 못했어요. 다시 눌러 보세요."); }
}

// Gemini의 답을 실제 댓글과 맞춰 봄: 없는 댓글 번호는 버리고, 근거가 없는 항목은 빼고, 비율·키워드 수는 직접 셈
function buildReport(raw, c) {
  const N = c.comments.length;
  const valid = (ev) => [...new Set((Array.isArray(ev) ? ev : []).filter((n) => Number.isInteger(n) && n >= 1 && n <= N))];
  const keep = (items, field) => (Array.isArray(items) ? items : [])
    .map((it) => ({ ...it, evidence: valid(it.evidence) }))
    .filter((it) => it.evidence.length && String(it[field] || "").trim());

  const byComment = new Map();
  for (const x of Array.isArray(raw.comments) ? raw.comments : []) {
    if (Number.isInteger(x.n) && x.n >= 1 && x.n <= N && !byComment.has(x.n)) byComment.set(x.n, x);
  }
  const counts = { 긍정: 0, 중립: 0, 부정: 0 };
  const langCount = new Map();
  for (const x of byComment.values()) {
    if (x.sentiment in counts) counts[x.sentiment]++;
    const lang = String(x.language || "알 수 없음").trim();
    langCount.set(lang, (langCount.get(lang) || 0) + 1);
  }
  const keywords = [...new Set((Array.isArray(raw.keywords) ? raw.keywords : []).map((w) => String(w).trim()).filter(Boolean))]
    .map((word) => ({ word, evidence: c.comments.filter((x) => x.text.toLowerCase().includes(word.toLowerCase())).map((x) => x.n) }))
    .filter((k) => k.evidence.length >= 2)
    .sort((a, b) => b.evidence.length - a.evidence.length)
    .slice(0, 10);
  const languages = keep(raw.languages, "reaction")
    .map((l) => ({ ...l, language: l.language.trim(), count: langCount.get(l.language.trim()) || l.evidence.length }))
    .sort((a, b) => b.count - a.count);

  return {
    summary: String(raw.summary || "").trim(),
    total: N,
    classified: Object.values(counts).reduce((a, b) => a + b, 0),
    counts,
    basis: keep(raw.sentimentBasis, "reason").filter((b) => b.label in counts),
    keywords,
    languages,
    praises: keep(raw.praises, "point"),
    criticisms: keep(raw.criticisms, "point"),
    actions: keep(raw.actions, "action"),
    createdAt: new Date()
  };
}

const pct = (n, total) => (total ? Math.round((n / total) * 100) : 0);
const stamp = (d) => `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
const SEGMENTS = [["긍정", "r-pos"], ["중립", "r-neu"], ["부정", "r-neg"]];

function evidenceHTML(ev) {
  const more = ev.length > 8 ? `<span>외 ${ev.length - 8}개</span>` : "";
  return `<div class="ev">근거 ${ev.slice(0, 8).map((n) => `<button class="evn" data-ev="${n}">#${n}</button>`).join("")}${more}<q>${esc(clip(current.comments[ev[0] - 1].text, 90))}</q></div>`;
}

function renderReport() {
  const r = report;
  const total = r.classified || 1;
  const block = (title, body) => `<section class="r-block"><h3>${title}</h3>${body}</section>`;
  const list = (items, main, sub) => items.length
    ? `<ul class="r-list">${items.map((it) => `<li><strong>${esc(it[main])}</strong>${sub && it[sub] ? `<p>${esc(it[sub])}</p>` : ""}${evidenceHTML(it.evidence)}</li>`).join("")}</ul>`
    : `<p class="r-none">댓글에서 찾지 못했어요.</p>`;

  $("report").innerHTML = `<div class="report" id="report-body">
    <div class="r-head"><h2>반응 분석 리포트</h2><p class="note">${esc(current.title)} · 인기 댓글 ${r.total}개 분석 · ${MODEL} · ${stamp(r.createdAt)}</p></div>
    ${block("전체 반응 핵심 요약", `<p class="r-summary">${esc(r.summary || "요약을 받지 못했어요.")}</p>`)}
    ${block("긍정 · 중립 · 부정 비율",
      `<div class="r-bar">${SEGMENTS.map(([l, cls]) => (r.counts[l] ? `<span class="${cls}" style="width:${pct(r.counts[l], total)}%"></span>` : "")).join("")}</div>
       <div class="r-legend">${SEGMENTS.map(([l, cls]) => `<span><i class="${cls}"></i>${l} <strong>${pct(r.counts[l], total)}%</strong> (${r.counts[l]}개)</span>`).join("")}</div>
       ${list(r.basis.map((b) => ({ ...b, head: `${b.label}으로 본 근거` })), "head", "reason")}`)}
    ${block("자주 나오는 키워드", r.keywords.length
      ? `<div class="r-kw">${r.keywords.map((k) => `<span>${esc(k.word)} <b>${k.evidence.length}</b></span>`).join("")}</div><p class="note" style="margin:8px 0 0">숫자는 그 단어가 실제로 들어간 댓글 수예요.</p>`
      : `<p class="r-none">여러 댓글에 반복되는 단어를 찾지 못했어요.</p>`)}
    ${block("언어권별 반응", list(r.languages.map((l) => ({ ...l, head: `${l.language} (${l.count}개)` })), "head", "reaction"))}
    <div class="r-two">${block("칭찬받은 점", list(r.praises, "point"))}${block("지적받은 점", list(r.criticisms, "point"))}</div>
    ${block("실무자 액션 제안", list(r.actions, "action", "reason"))}
    <p class="r-foot">AI가 위 댓글만 읽고 만든 리포트예요. 근거 댓글 번호(#)를 누르면 원래 댓글로 이동해요.${r.classified < r.total ? ` 감정을 분류하지 못한 댓글 ${r.total - r.classified}개는 비율에서 뺐어요.` : ""}</p>
    <div class="r-export"><button class="go" data-export="word">Word로 내보내기</button><button class="go ghost" data-export="pdf">PDF로 내보내기</button></div>
  </div>`;
}

async function makeReport() {
  if (!current) return;
  if (!keys.gemini) { renderKey("gemini", "먼저 Gemini API 키를 넣고 '저장'을 눌러 주세요."); $("key-gemini").scrollIntoView({ block: "center" }); return; }
  const forVideo = current;
  const btn = $("report-btn");
  btn.disabled = true;
  btn.textContent = "분석하는 중…";
  $("report").innerHTML = `<div class="msg loading">Gemini가 댓글 ${current.comments.length}개를 읽고 있어요. 10~30초쯤 걸려요.</div>`;
  try {
    const raw = await askGemini(forVideo);
    if (current !== forVideo) return;
    report = buildReport(raw, forVideo);
    renderReport();
  } catch (err) {
    if (current === forVideo) $("report").innerHTML = `<div class="msg">${esc(err.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "리포트 다시 만들기";
  }
}

function showEvidence(n) {
  const li = $("cmt-" + n);
  if (!li) return;
  li.scrollIntoView({ block: "center" });
  li.classList.add("flash");
  setTimeout(() => li.classList.remove("flash"), 1600);
}

// ── 리포트 내보내기 (Word · PDF) ──
function loadScript(src, globalName) {
  if (window[globalName]) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error("내보내기 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."));
    document.head.append(s);
  });
}

const exportName = (ext) => `반응분석_${current.title.replace(/[\\/:*?"<>|]/g, "").trim().slice(0, 40)}_${stamp(report.createdAt).slice(0, 10).replaceAll(".", "")}.${ext}`;

async function exportWord() {
  await loadScript("https://unpkg.com/docx@9.5.1/dist/index.umd.cjs", "docx");
  const { Document, Packer, Paragraph, TextRun, HeadingLevel } = window.docx;
  const r = report;
  const P = (text, run = {}) => new Paragraph({ children: [new TextRun({ text, ...run })], spacing: { after: 120 } });
  const H1 = (text) => new Paragraph({ text, heading: HeadingLevel.HEADING_1, spacing: { after: 120 } });
  const H2 = (text) => new Paragraph({ text, heading: HeadingLevel.HEADING_2, spacing: { before: 280, after: 120 } });
  const EV = (ev) => P("근거 " + ev.map((n) => `#${n}`).join(" ") + ` · “${clip(current.comments[ev[0] - 1].text, 90)}”`, { size: 18, color: "888888" });
  const items = (list, main, sub) => (list.length
    ? list.flatMap((it) => [P("• " + it[main], { bold: true }), ...(sub && it[sub] ? [P(it[sub])] : []), EV(it.evidence)])
    : [P("댓글에서 찾지 못했어요.", { color: "888888" })]);
  const total = r.classified || 1;

  const children = [
    H1("반응 분석 리포트"),
    P(`${current.title} · ${current.channel}`, { bold: true }),
    P(`인기 댓글 ${r.total}개 분석 · ${MODEL} · ${stamp(r.createdAt)}`, { color: "888888" }),
    H2("전체 반응 핵심 요약"), P(r.summary || "요약을 받지 못했어요."),
    H2("긍정 · 중립 · 부정 비율"),
    P(SEGMENTS.map(([l]) => `${l} ${pct(r.counts[l], total)}% (${r.counts[l]}개)`).join("   ")),
    ...items(r.basis.map((b) => ({ ...b, head: `${b.label}으로 본 근거` })), "head", "reason"),
    H2("자주 나오는 키워드"),
    P(r.keywords.length ? r.keywords.map((k) => `${k.word} (${k.evidence.length})`).join(", ") : "여러 댓글에 반복되는 단어를 찾지 못했어요."),
    ...(r.keywords.length ? [P("괄호 안 숫자는 그 단어가 실제로 들어간 댓글 수예요.", { size: 18, color: "888888" })] : []),
    H2("언어권별 반응"), ...items(r.languages.map((l) => ({ ...l, head: `${l.language} (${l.count}개)` })), "head", "reaction"),
    H2("칭찬받은 점"), ...items(r.praises, "point"),
    H2("지적받은 점"), ...items(r.criticisms, "point"),
    H2("실무자 액션 제안"), ...items(r.actions, "action", "reason"),
    P("AI가 아래 댓글만 읽고 만든 리포트예요. 근거 번호는 부록의 댓글 번호예요.", { size: 18, color: "888888" }),
    H2("부록: 분석한 댓글"),
    ...current.comments.flatMap((c) => [P(`#${c.n}  ${c.author} · ${c.date} · 좋아요 ${c.likes.toLocaleString("ko-KR")}`, { bold: true, size: 18 }), P(c.text, { size: 20 })])
  ];
  const doc = new Document({ styles: { default: { document: { run: { font: "Malgun Gothic", size: 21 } } } }, sections: [{ children }] });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(await Packer.toBlob(doc));
  a.download = exportName("docx");
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function exportPdf() {
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js", "html2pdf");
  const paper = document.createElement("div");
  paper.className = "paper";
  paper.innerHTML = $("report-body").outerHTML +
    `<section class="r-block"><h3>부록: 분석한 댓글</h3><ol class="cmts">${current.comments.map(commentHTML).join("")}</ol></section>`;
  paper.querySelector(".r-export")?.remove();
  paper.querySelector(".r-foot").textContent = "AI가 아래 댓글만 읽고 만든 리포트예요. 근거 번호는 부록의 댓글 번호예요.";
  paper.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
  const holder = document.createElement("div"); // 화면 밖에 잠깐 두는 상자
  holder.style.cssText = "position: fixed; left: -10000px; top: 0;";
  holder.append(paper);
  document.body.append(holder);
  try {
    await window.html2pdf().set({
      margin: 12,
      filename: exportName("pdf"),
      image: { type: "jpeg", quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: "#FFFFFF" },
      jsPDF: { unit: "mm", format: "a4" },
      pagebreak: { mode: ["css", "legacy"], avoid: [".r-list li", ".cmt", ".r-head", ".r-bar"] }
    }).from(paper).save();
  } finally {
    holder.remove();
  }
}

async function exportReport(kind, button) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = "만드는 중…";
  try { await (kind === "word" ? exportWord() : exportPdf()); }
  catch (err) { alert(err.message || "파일을 만들지 못했어요. 다시 눌러 보세요."); }
  finally { button.disabled = false; button.textContent = label; }
}

// 기사 받기: 처음 열 때 한 번, 그 뒤 5분마다 새로 모은 기사가 있는지 확인 (스크랩은 그대로 남음)
async function load() {
  try {
    const res = await fetch("articles.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (data.collectedAt === COLLECTED_AT) return;
    COLLECTED_AT = data.collectedAt;
    ARTICLES = data.articles;
    ARTICLES.forEach((a) => seenNow.add(a.url));
    store.set("seen", keep(seenNow, 2000));
  } catch { /* 못 받으면 지금 보이는 기사를 그대로 둠 */ }
  renderAll();
}
